worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server {
        listen 80;
        server_name localhost;

        location /health {
            access_log off;
            return 200 "OK";
        }

        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;

        error_page 502 503 504 =503 /service-unavailable;

    	location /service-unavailable {
    		internal;
    		add_header Content-Type application/json;
    		add_header Retry-After 30;
    		return 503 '{"error":"CCSOP service temporarily unavailable"}';
	}

	location /api/ {
        	# Gestion des requêtes de pré-vol (OPTIONS) du navigateur
        	if ($request_method = 'OPTIONS') {
            		add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
            		add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            		add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
            		add_header 'Access-Control-Allow-Credentials' 'true' always;
            		add_header 'Access-Control-Max-Age' 1728000;
            		add_header 'Content-Type' 'text/plain charset=UTF-8';
            		add_header 'Content-Length' 0;
            		return 204;
        	}

       		 # En-têtes CORS pour les vraies requêtes (GET, POST, etc.)
        		add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
        		add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        		add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
        		add_header 'Access-Control-Allow-Credentials' 'true' always;

        		proxy_pass http://ms-account:8080; 
       			proxy_set_header Host $host;
       			proxy_set_header X-Real-IP $remote_addr;
    }
}
}
