services:
  # -----------------------------
  # MySQL
  # -----------------------------
  ms-CCSOP-database:
    image: mysql:8.0
    container_name: ms-CCSOP-database
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-CCSOP-volume:/var/lib/mysql
      - ./mysql-init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - databases
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -----------------------------
  # Account Microservice
  # -----------------------------
  ms-account:
    build: ms-account
    container_name: ms-account
    depends_on:
      ms-CCSOP-database:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_VOTING_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      # Utilisez 'validate' ou 'none' si vos tables existent déjà
      SPRING_JPA_HIBERNATE_DDL_AUTO: update 
    networks:
      - databases
      - ms-account
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  # -----------------------------
  # Nginx API Gateway
  # -----------------------------
  ms-api-gateway:
    build: ms-api-gateway
    container_name: ms-api-gateway
    ports:
      - "${NGINX_PORT}:80"
    depends_on:
      ms-account:
        condition: service_healthy
    networks:
      - dmz
      - ms-account
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
networks:
  dmz:
    driver: bridge
  databases:
    driver: bridge
    internal: true
  ms-account:
    driver: bridge

volumes:
  mysql-CCSOP-volume: